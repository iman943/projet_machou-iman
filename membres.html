<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membres - InfoHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <nav class="sidebar">
            <div class="logo"><h1 class="lang-txt" data-key="logo">InfoHub</h1></div>
            <ul>
                <li><a href="index.html" class="lang-txt" data-key="nav_dash">Tableau de bord</a></li>
                <li><a href="ressources.html" class="lang-txt" data-key="nav_res">Ressources</a></li>
                <li class="active"><a href="membres.html" class="lang-txt" data-key="nav_mem">Membres</a></li>
                <li class="logout-item">
                    <a href="#" onclick="deconnexion()" class="lang-txt" data-key="nav_out">Déconnexion</a>
                </li>
            </ul>
        </nav>

        <main class="main-content">
             <header class="top-bar">
                <div class="lang-selector">
                    <select id="selectLangue" onchange="changerLangue(this.value)">
                        <option value="fr">Français 🇫🇷</option>
                        <option value="en">English 🇬🇧</option>
                        <option value="ar">العربية 🇲🇦</option>
                    </select>
                </div>
            </header>
            <section class="management-section">
                <h2 class="lang-txt" data-key="nav_mem">Membres</h2>
                <table>
                    <thead>
                        <tr>
                            <th class="lang-txt" data-key="th_name">Nom</th>
                            <th class="lang-txt" data-key="th_role">Rôle</th>
                            <th class="lang-txt" data-key="th_status">Statut</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td>Iman Machou</td><td>Admin</td><td>En ligne</td></tr>
                        <tr><td>Jean Dupont</td><td>Utilisateur</td><td>Hors ligne</td></tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/lang.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
