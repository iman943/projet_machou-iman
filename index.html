<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - InfoHub Management</title>
    <link rel="stylesheet" href="style.css">
    <script>
        if (localStorage.getItem('estConnecte') !== 'true') {
            window.location.href = "login.html";
        }
        
        function deconnexion() {
            localStorage.removeItem('estConnecte');
            window.location.href = "login.html";
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <nav class="sidebar">
            <div class="logo">
                <h1 class="lang-txt" data-key="logo">InfoHub</h1>
            </div>
            <ul>
                <li class="active"><a href="index.html" class="lang-txt" data-key="nav_dash">Tableau de bord</a></li>
                <li><a href="ressources.html" class="lang-txt" data-key="nav_res">Ressources</a></li>
                <li><a href="membres.html" class="lang-txt" data-key="nav_mem">Membres</a></li>
                <li class="logout-item">
                    <a href="#" onclick="deconnexion()" class="lang-txt" data-key="nav_out">Déconnexion</a>
                </li>
            </ul>
        </nav>

        <main class="main-content">
            <header class="top-bar">
                <button id="themeToggle" onclick="toggleDarkMode()" class="btn-icon">
                    <span id="themeIcon">🌙</span> <span class="lang-txt" data-key="btn_theme">Mode Sombre</span>
                </button>
                <div class="lang-selector">
                    <select id="selectLangue" onchange="changerLangue(this.value)">
                        <option value="fr">Français 🇫🇷</option>
                        <option value="en">English 🇬🇧</option>
                        <option value="ar">العربية 🇲🇦</option>
                    </select>
                </div>
            </header>

            <h2 class="section-title lang-txt" data-key="title_stats">Statistiques du Centre</h2>

            <div class="kpi-grid">
                <div class="card"><h3 id="stat_res">1,250</h3><p class="lang-txt" data-key="kpi_res">Ressources</p></div>
                <div class="card"><h3 id="stat_mem">450</h3><p class="lang-txt" data-key="kpi_mem">Membres</p></div>
                <div class="card"><h3 id="stat_emp">85</h3><p class="lang-txt" data-key="kpi_emp">Emprunts</p></div>
                <div class="card"><h3 id="stat_cat">12</h3><p class="lang-txt" data-key="kpi_cat">Catégories</p></div>
            </div>

            <div class="charts-grid">
                <div class="chart-box"><canvas id="monGraphique"></canvas></div>
                <div class="chart-box"><canvas id="chartPie"></canvas></div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script src="js/lang.js"></script>
</body>
</html>
